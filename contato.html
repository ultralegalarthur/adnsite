<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV Store - Contato</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <h1>ADV STORE</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('inicio') }}">Home</a></li>
                <li><a href="{{ url_for('novidades') }}">Drops / Novidades</a></li>
                <li><a href="{{ url_for('colecionadores') }}">Oversized / Essentials</a></li>
                <li><a href="{{ url_for('starwars') }}">Edições Limitadas</a></li>
                <li><a href="{{ url_for('contato') }}">Contato</a></li>
                <li><a href="{{ url_for('carrinho') }}">Carrinho</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2>Fale Conosco</h2>
        <form action="#" method="POST">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ADV STORE - STREETWEAR CULTURE</p>
    </footer>
</body>
</html>
