<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADV Store - Criar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <h1>ADV STORE</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('inicio') }}">Home</a></li>
                <li><a href="{{ url_for('novidades') }}">Drops / Novidades</a></li>
                <li><a href="{{ url_for('colecionadores') }}">Oversized / Essentials</a></li>
                <li><a href="{{ url_for('starwars') }}">Edições Limitadas</a></li>
                <li><a href="{{ url_for('contato') }}">Contato</a></li>
                <li><a href="{{ url_for('carrinho') }}">Carrinho</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2>Criar Conta</h2>
        <form action="{{ url_for('criar_cliente') }}" method="POST">
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf">
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone">
            </div>

            <button type="submit" class="btn">Cadastrar</button>
        </form>
        <p>Já possui uma conta? <a href="{{ url_for('login') }}">Faça Login</a></p>
    </main>

    <footer>
        <p>&copy; 2026 ADV STORE - STREETWEAR CULTURE</p>
    </footer>
</body>
</html>
